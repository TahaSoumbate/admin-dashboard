<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>admin dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-100 text-slate-900 antialiased">
    <div class="min-h-dvh lg:flex">
      <header class="bg-slate-900 text-slate-300 lg:sticky lg:top-0 lg:h-dvh lg:w-64 lg:shrink-0">
        <div class="flex items-center justify-between px-5 py-4 lg:block">
          <a href="" class="flex items-center gap-2 font-bold text-white"
            ><span class="grid size-8 place-items-center rounded-lg bg-indigo-500">A</span>Admin</a
          >
          <details class="relative lg:hidden">
            <summary class="cursor-pointer list-none rounded-md px-3 py-1.5 text-sm ring-1 ring-slate-600">
              Menu
            </summary>
            <nav class="absolute right-0 z-20 pt-2 w-48 space-y-1 rounded-xl bg-slate-800 p-2 shadow-xl">
              <a href="" class="block rounded-md hover:bg-slate-700 px-3 py-2 text-white">Overview</a>
              <a href="" class="block rounded-md hover:bg-slate-700 px-3 py-2">Orders</a>
              <a href="" class="block rounded-md hover:bg-slate-700 px-3 py-2">Customers</a>
              <a href="" class="block rounded-md hover:bg-slate-700 px-3 py-2">Settings</a>
            </nav>
          </details>
        </div>
        <nav class="hidden space-y-1 px-3 lg:block">
          <a
            href=""
            data-active
            class="flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-slate-800 data-active:bg-slate-800 data-active:text-white"
            >📊 Overview</a
          >
          <a href="" class="flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-slate-800"
            >🧾 Orders <span class="ms-auto rounded-full bg-indigo-500 px-2 text-xs font-medium text-white">12</span></a
          >
          <a href="" class="flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-slate-800">👥 Customers</a>
          <a href="" class="flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-slate-800">⚙️ Settings</a>
        </nav>
      </header>
      <main class="flex-1 p-4 md:p-8">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h1 class="text-2xl font-bold tracking-tight">Overview</h1>
            <p class="text-sm text-slate-500">Last 30 days</p>
          </div>
          <label for="" class="relative block sm:w-72">
            <span class="sr-only">Search orders</span>
            <input
              type="search"
              placeholder="Search orders…"
              class="w-full rounded-lg border border-slate-300 bg-white py-2 ps-9 pe-3 text-sm placeholder:text-slate-400 focus:border-indigo-500 focus:outline-hidden focus:ring-2 focus:ring-indigo-500/30" />
            <span class="absolute pointer-events-none inset-s-3 top-2 text-slate-400" aria-hidden="true">🔍</span>
          </label>
        </div>
        <section class="mt-8 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
          <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
            <p class="text-sm text-slate-500">Revenue</p>
            <p class="mt-2 text-3xl font-bold tabular-nums">$148,290</p>
            <span
              class="mt-3 inline-flex items-center gap-1 rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-medium text-emerald-700"
              >▲ 12.4%</span
            >
          </div>
          <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
            <p class="text-sm text-slate-500">Orders</p>
            <p class="mt-2 text-3xl font-bold tabular-nums">1,204</p>
            <span
              class="mt-3 inline-flex items-center gap-1 rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-medium text-emerald-700"
              >▲ 4.1%</span
            >
          </div>
          <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
            <p class="text-sm text-slate-500">Refunds</p>
            <p class="mt-2 text-3xl font-bold tabular-nums">38</p>
            <span
              class="mt-3 inline-flex items-center gap-1 rounded-full bg-rose-50 px-2 py-0.5 text-xs font-medium text-rose-700"
              >▼ 2.0%</span
            >
          </div>
          <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
            <p class="text-sm text-slate-500">Conversion</p>
            <p class="mt-2 text-3xl font-bold tabular-nums">3.6%</p>
            <div class="mt-4 h-2 overflow-hidden rounded-full bg-slate-100">
              <div class="h-full w-1/3 rounded-full bg-indigo-500"></div>
            </div>
          </div>
        </section>
        <section class="mt-8 rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
          <h2 class="font-semibold">Weekly sales</h2>
          <div class="mt-6 flex h-42  gap-3">
            <div class="flex h-full flex-1 flex-col justify-end"><div class="h-1/3 rounded-t-md bg-indigo-200 hover:bg-indigo-400 transition"></div><p class="mt-2 text-center text-xs text-slate-500">Mon</p></div>
            <div class="flex h-full flex-1 flex-col justify-end"><div class="h-1/2 rounded-t-md bg-indigo-200 hover:bg-indigo-400 transition"></div><p class="mt-2 text-center text-xs text-slate-500">Tue</p></div>
            <div class="flex h-full flex-1 flex-col justify-end"><div class="h-2/5 rounded-t-md bg-indigo-200 hover:bg-indigo-400 transition"></div><p class="mt-2 text-center text-xs text-slate-500">Wed</p></div>
            <div class="flex h-full flex-1 flex-col justify-end"><div class="h-3/4 rounded-t-md bg-indigo-200 hover:bg-indigo-400 transition"></div><p class="mt-2 text-center text-xs text-slate-500">Thu</p></div>
            <div class="flex h-full flex-1 flex-col justify-end"><div class="h-3/5 rounded-t-md bg-indigo-200 hover:bg-indigo-400 transition"></div><p class="mt-2 text-center text-xs text-slate-500">Fri</p></div>
            <div class="flex h-full flex-1 flex-col justify-end"><div class="h-1/4 rounded-t-md bg-indigo-200 hover:bg-indigo-400 transition"></div><p class="mt-2 text-center text-xs text-slate-500">Sat</p></div>
            <div class="flex h-full flex-1 flex-col justify-end"><div class="h-1/5 rounded-t-md bg-indigo-200 hover:bg-indigo-400 transition"></div><p class="mt-2 text-center text-xs text-slate-500">Sun</p></div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
